[sdl]
maximize = true
output = direct3d

[render]
aspect = true
aspect_ratio = 0:0
doublescan = true
scaler = none

[dosbox]
machine = svga_s3
captures = C:\prj\Centurion_Defender_of_Rome\analysis\capture

[cpu]
cycles = max

[midi]
mpu401 = intelligent
mididevice = mt32
mt32.romdir = C:\prj\Centurion_Defender_of_Rome\mt32-roms

[autoexec]
mount c "C:\prj\Centurion_Defender_of_Rome\Centurion_Defender_of_Rome"
c:
MOUSE.COM
CENTURIO.EXE v mt
